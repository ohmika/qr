name: Build QR Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "settings.gradle"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qr-android-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean :app:assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/QR-Barcode-v1.0-debug.apk
          test -s out/QR-Barcode-v1.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QR-Barcode-APK
          path: out/QR-Barcode-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qr-android-${{ github.run_number }}
          name: QR & Barcode Android APK ${{ github.run_number }}
          body: |
            Installable Android debug APK built from the `main` branch.
            Package: `nl.ohmika.qr`
            Version: `1.0`
          files: out/QR-Barcode-v1.0-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
